<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foreigner Registration - ExploreNaga</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>

<body class="bg-gray-100 flex justify-center py-0 sm:py-6 antialiased text-gray-800">

  <div class="w-full max-w-md bg-white shadow-xl min-h-screen sm:rounded-3xl overflow-hidden flex flex-col">
    
    <!-- Top Bar with Back Button -->
    <header class="flex items-center gap-3 px-5 py-4 border-b border-gray-100 sticky top-0 bg-white z-50">
      <a href="dashboard.html" class="p-1 -ml-1 text-gray-700 hover:text-emerald-900">
        <i data-lucide="arrow-left" class="w-6 h-6"></i>
      </a>
      <h1 class="font-bold text-base text-gray-900">Foreigner Registration</h1>
    </header>

    <main class="p-5 space-y-4 flex-1">
      <div class="bg-emerald-50 border border-emerald-100 rounded-xl p-3 text-xs text-emerald-900">
        <p class="font-semibold">Notice for International Visitors</p>
        <p class="text-[11px] text-emerald-700 mt-0.5">
          Foreign nationals must register with the local FRO within 24 hours of arrival in Nagaland.
        </p>
      </div>

      <form id="registrationForm" class="space-y-3.5 text-xs">
        <div>
          <label class="block font-semibold text-gray-700 mb-1">Full Name (as on Passport)</label>
          <input 
            id="fullName" 
            type="text" 
            required 
            placeholder="John Doe"
            class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-emerald-600"
          >
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold text-gray-700 mb-1">Passport Number</label>
            <input 
              id="passportNumber" 
              type="text" 
              required 
              placeholder="A12345678"
              class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-emerald-600"
            >
          </div>
          <div>
            <label class="block font-semibold text-gray-700 mb-1">Nationality</label>
            <input 
              id="nationality" 
              type="text" 
              required 
              placeholder="e.g. British, Japanese"
              class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-emerald-600"
            >
          </div>
        </div>

        <div>
          <label class="block font-semibold text-gray-700 mb-1">Date of Entry</label>
          <input 
            id="entryDate" 
            type="date" 
            required 
            class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-emerald-600"
          >
        </div>

        <div>
          <label class="block font-semibold text-gray-700 mb-1">Local Address / Hotel in Nagaland</label>
          <input 
            id="localAddress" 
            type="text" 
            placeholder="e.g., Hotel Japfü, Kohima" 
            required 
            class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-emerald-600"
          >
        </div>

        <div>
          <label class="block font-semibold text-gray-700 mb-1">Upload Passport / Visa Copy</label>
          <input 
            id="documentFile"
            type="file" 
            accept="image/*,.pdf"
            class="w-full text-[11px] text-gray-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-emerald-50 file:text-emerald-800 file:font-semibold"
          >
        </div>

        <p id="statusMessage" class="hidden text-xs text-center font-medium"></p>

        <button 
          id="submitBtn" 
          type="submit" 
          class="w-full mt-4 bg-emerald-800 hover:bg-emerald-900 text-white font-semibold py-2.5 rounded-xl shadow-sm transition disabled:opacity-50"
        >
          Submit Registration
        </button>
      </form>
    </main>

  </div>

  <script type="module">
  import { auth, db, storage } from "./firebase.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
  import { 
    collection, 
    addDoc, 
    serverTimestamp 
  } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
  import { 
    ref, 
    uploadBytes, 
    getDownloadURL 
  } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-storage.js";

  let currentUser = null;

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "login.html";
    } else {
      currentUser = user;
    }
  });

  const form = document.getElementById("registrationForm");
  const submitBtn = document.getElementById("submitBtn");
  const statusMessage = document.getElementById("statusMessage");
  const fileInput = document.getElementById("documentFile");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!currentUser) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Uploading & Submitting...";
    statusMessage.classList.add("hidden");

    try {
      let documentUrl = "";

      // Upload file to Firebase Storage if selected
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const fileExtension = file.name.split(".").pop();
        // Path: foreigner_documents/{uid}/{timestamp}.ext
        const storagePath = `foreigner_documents/${currentUser.uid}/${Date.now()}.${fileExtension}`;
        const storageRef = ref(storage, storagePath);

        const uploadSnapshot = await uploadBytes(storageRef, file);
        documentUrl = await getDownloadURL(uploadSnapshot.ref);
      }

      // Save record to Firestore
      const registrationData = {
        userId: currentUser.uid,
        userEmail: currentUser.email,
        fullName: document.getElementById("fullName").value.trim(),
        passportNumber: document.getElementById("passportNumber").value.trim().toUpperCase(),
        nationality: document.getElementById("nationality").value.trim(),
        entryDate: document.getElementById("entryDate").value,
        localAddress: document.getElementById("localAddress").value.trim(),
        documentUrl: documentUrl, // Public/download link to uploaded image/pdf
        status: "Pending",
        createdAt: serverTimestamp()
      };

      await addDoc(collection(db, "foreigner_registrations"), registrationData);

      statusMessage.textContent = "Registration and document uploaded successfully!";
      statusMessage.className = "text-xs text-center font-medium text-emerald-700 block";
      
      form.reset();
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 1500);

    } catch (error) {
      console.error("Submission failed:", error);
      statusMessage.textContent = "Failed to submit. Check console for details.";
      statusMessage.className = "text-xs text-center font-medium text-red-600 block";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit Registration";
    }
  });

  lucide.createIcons();
</script>
</body>
</html>
