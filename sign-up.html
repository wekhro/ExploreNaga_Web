```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - ExploreNaga</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4faf5;
            color: #183326;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .signup-container {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            font-size: 42px;
            color: #28734e;
        }

        .logo h1 {
            color: #075b36;
            font-size: 28px;
            margin-top: 5px;
        }

        .logo p {
            color: #66736b;
            font-size: 11px;
            margin-top: 4px;
        }

        .signup-container h2 {
            text-align: center;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;

            font-size: 14px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;

            padding: 12px 15px;

            border: 1px solid #cbd8ce;
            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }

        .form-group input:focus {
            border-color: #28734e;
        }

        .signup-submit {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 25px;

            background: #075b36;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .signup-submit:hover {
            background: #06452d;
        }

        .login-text {
            text-align: center;

            margin-top: 20px;

            font-size: 14px;
        }

        .login-text a {
            color: #075b36;

            font-weight: bold;

            text-decoration: none;
        }

        .back-home {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #66736b;

            text-decoration: none;

            font-size: 14px;
        }
    </style>

</head>

<body>

    <div class="signup-container">

        <div class="logo">

            <div class="logo-icon">
                🍃
            </div>

            <h1>ExploreNaga</h1>

            <p>DISCOVER • EXPERIENCE • REMEMBER</p>

        </div>

        <h2>Create Account</h2>

        <form id="signupForm">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirm-password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="signup-submit"
            >
                Create Account
            </button>

        </form>


        <p class="login-text">
            Already have an account?
            <a href="login.html">
                Login
            </a>
        </p>


        <a
            href="index.html"
            class="back-home"
        >
            ← Back to ExploreNaga
        </a>

    </div>
    <script type="module">

    import { createUserWithEmailAndPassword, updateProfile }
        from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    import { auth }
        from "./firebase.js";


    const signupForm = document.getElementById("signupForm");


    signupForm.addEventListener("submit", async (event) => {

        event.preventDefault();


        // Get values from the form
        const name = document.getElementById("name").value.trim();

        const email = document.getElementById("email").value.trim();

        const password = document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirm-password").value;


        // Check passwords
        if (password !== confirmPassword) {

            alert("Passwords do not match.");

            return;
        }


        // Check password length
        if (password.length < 6) {

            alert("Password must be at least 6 characters.");

            return;
        }


        try {

            // Create Firebase account
            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user = userCredential.user;


            // Save the user's name in Firebase Authentication
            await updateProfile(user, {
                displayName: name
            });


            console.log("Account created:", user);


            alert("Account created successfully!");


            // Go to dashboard
            window.location.href = "dashboard.html";


        } catch (error) {

            console.error("Signup error:", error);


            if (error.code === "auth/email-already-in-use") {

                alert("This email is already registered.");

            }
            else if (error.code === "auth/invalid-email") {

                alert("Please enter a valid email address.");

            }
            else if (error.code === "auth/weak-password") {

                alert("Password is too weak. Use at least 6 characters.");

            }
            else {

                alert("Signup failed: " + error.message);

            }

        }

    });

</script>

</body>

</html>
```
