<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExploreNaga - Tourism Guide</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Placeholder for menu.html -->
    <div id="menu-container"></div>

    <!-- ================= HEADER ================= -->
    <header>
        <button class="menu-button" onclick="openMenu()" aria-label="Open menu">
            ☰
        </button>

        <div class="logo">
            <div class="logo-icon">▲</div>
            <div>
                <h2>ExploreNaga 🌿</h2>
                <p>Stay connected, Travel Safely</p>
            </div>
        </div>

        <div class="header-buttons">
            <button class="safety-button" onclick="openMenu()">
                ✧
            </button>
            <button class="login-button" onclick="window.location.href='login.html'">
                Login
            </button>
        </div>
    </header>

    <!-- ================= HERO IMAGE ================= -->
    <section class="hero">
        <img id="heroImage" src="images/Sheep Farm.jpeg" alt="Sheep Farm, Kohima, Nagaland">

        <button class="arrow left" onclick="previousSlide()">‹</button>
        <button class="arrow right" onclick="nextSlide()">›</button>

        <div class="dots">
            <span onclick="showSlide(0)" class="dot active"></span>
            <span onclick="showSlide(1)" class="dot"></span>
            <span onclick="showSlide(2)" class="dot"></span>
            <span onclick="showSlide(3)" class="dot"></span>
        </div>
    </section>

    <!-- ================= MAIN CONTENT ================= -->
    <main>
        <p class="welcome-text">Welcome to Nagaland, India</p>
        <h1>ExploreNaga 🌿</h1>

        <!-- Quick Options with Direct Links -->
        <div class="options">
            <button class="option" onclick="window.location.href='login.html'">
                <span class="option-icon">🔒</span>
                <span>Login to check-in/SOS</span>
            </button>

            <button class="option" id="transport" onclick="window.location.href='essentials.html#transport'">
                <span class="option-icon">🚌</span>
                <span>Transport Fares<small>(Bus, shared taxi, etc.)</small></span>
                <span class="arrow-down">⌄</span>
            </button>

            <button class="option" id="safety" onclick="window.location.href='essentials.html#ilp'">
                <span class="option-icon">ⓘ</span>
                <span>Essential Info<small>(Entry Requirements, Do's & Don'ts)</small></span>
            </button>
        </div>

        <!-- Destinations Grid -->
        <h2 class="section-title" id="destinations">Popular Destinations</h2>

        <div class="destinations">
            <div class="destination" onclick="window.location.href='destination.html'" style="cursor: pointer;">
                <img src="images/Sheep Farm.jpeg" alt="Sheep Farm, Kohima, Nagaland">
            </div>
            <div class="destination" onclick="window.location.href='destination.html'" style="cursor: pointer;">
                <img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Kachari_Ruins,_Dimapur,_Nagaland.jpg" alt="Kachari Ruins, Dimapur, Nagaland">
            </div>
            <div class="destination" onclick="window.location.href='destination.html'" style="cursor: pointer;">
                <img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Khonoma_village,_Nagaland,_India.jpg" alt="Khonoma Village, Nagaland">
            </div>
            <div class="destination" onclick="window.location.href='destination.html'" style="cursor: pointer;">
                <img src="https://www.oddessemania.in/wp-content/uploads/2023/08/Dzukou-valley-trek-photo-02-1-1024x668.jpeg" alt="Dzükou Valley, Nagaland">
            </div>
        </div>
    </main>

    <!-- ================= FOOTER ================= -->
    <footer>
        <div class="footer-links">
            <a href="safety.html">Our Safety</a>
            <a href="#">Be Responsible</a>
            <a href="essentials.html#etiquette">Respect Culture</a>
        </div>
        <p>© 2026 ExploreNaga</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
